<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İSTE Siber Güvenlik Zirvesi</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex flex-col items-center justify-center p-4">

    <div id="main-card" class="max-w-md w-full bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700 p-8">
        <div class="text-center mb-8">
            <h1 onclick="adminTrigger()" class="text-2xl font-bold text-white cursor-default select-none">
                <span id="trigger" class="text-cyan-500">S</span>iber Güvenlik ve Girişimcilik Zirvesi
            </h1>
            <p class="text-slate-400 text-sm mt-2">14 Mayıs 2026 - Kayıt Formu</p>
        </div>

        <div id="form-section" class="space-y-4">
            <input type="text" id="fullname" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-500" placeholder="Ad Soyad">
            <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 outline-none focus:ring-2 focus:ring-cyan-500" placeholder="E-posta">
            <button onclick="checkIn()" id="submit-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition">Oturuma Katıl</button>
        </div>

        <div id="result-section" class="hidden text-center space-y-6">
            <div id="status-msg" class="p-4 rounded-lg bg-slate-800 border border-slate-700"></div>
            <button id="pdf-btn" onclick="downloadPDF()" class="hidden w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition shadow-lg">
                Sertifikayı İndir (.PDF)
            </button>
            <button onclick="location.reload()" class="text-xs text-slate-500 underline">Geri Dön</button>
        </div>
    </div>

    <div id="admin-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 z-50">
        <div class="bg-[#1e293b] border border-red-500/50 p-6 rounded-xl w-full max-w-xs">
            <p class="text-red-500 font-bold text-xs mb-4 text-center text-white">YÖNETİM PANELİ</p>
            <select id="session-select" class="bg-slate-900 text-sm p-3 rounded-lg mb-4 w-full border border-slate-700 text-white">
                <option value="1">1. Oturum Başlat</option>
                <option value="2">2. Oturum Başlat</option>
                <option value="3">3. Oturum Başlat</option>
                <option value="4">4. Oturum Başlat</option>
                <option value="5">5. Oturum Başlat</option>
                <option value="6">6. Oturum Başlat</option>
            </select>
            <button onclick="updateActiveSession()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg mb-2">Güncelle</button>
            <button onclick="toggleAdmin()" class="w-full text-slate-400 text-xs">Kapat</button>
        </div>
    </div>

    <script>
        // DEĞİŞKENLERİ ÖNCEDEN TANIMLIYORUZ (Konsoldaki ReferenceError'u çözer)
        let clickCount = 0;
        let userData = null;

        // URL ve KEY (Resimdeki bilgilere göre düzeltildi)
        const SUPABASE_URL = "https://ipyfvbwziclshlwmvxex.supabase.co"; 
        const SUPABASE_KEY = "sb_publishable_Zii67NtGjP1fkJGjoUkVbg_3fJdy4Y-";

        // Supabase Client Başlatma (window.supabase kullanarak konsol hatasını çözer)
        const _supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Admin Paneli Fonksiyonları
        function adminTrigger() {
            clickCount++;
            if (clickCount === 5) {
                toggleAdmin();
                clickCount = 0;
            }
            setTimeout(() => { clickCount = 0; }, 2000);
        }

        function toggleAdmin() {
            document.getElementById('admin-modal').classList.toggle('hidden');
        }

        async function updateActiveSession() {
            const sId = document.getElementById('session-select').value;
            const { error } = await _supabase.from('ayarlar').update({ aktif_oturum_id: sId }).eq('id', 1);
            if(error) alert("Hata: " + error.message);
            else { alert("Oturum " + sId + " aktif edildi."); toggleAdmin(); }
        }

        // Katılım Fonksiyonu
        async function checkIn() {
            const name = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submit-btn');

            if(!name || !email) return alert("Bilgileri girin.");
            btn.disabled = true; btn.innerText = "İşleniyor...";

            try {
                const { data: config } = await _supabase.from('ayarlar').select('aktif_oturum_id').single();
                
                const { error: rpcErr } = await _supabase.rpc('upsert_attendance', { 
                    p_email: email, p_name: name, p_session: config.aktif_oturum_id 
                });
                if(rpcErr) throw rpcErr;

                const { data: user } = await _supabase.from('katilimcilar').select('*').eq('email', email).single();
                userData = user;

                document.getElementById('form-section').classList.add('hidden');
                document.getElementById('result-section').classList.remove('hidden');

                const sessionCount = user.oturumlar.filter(x => x !== null).length;
                const msgBox = document.getElementById('status-msg');

                if(sessionCount >= 3) {
                    msgBox.innerHTML = `<b class="text-green-400">TEBRİKLER!</b><br>${sessionCount} oturuma katıldınız. Sertifikanız hazır.`;
                    document.getElementById('pdf-btn').classList.remove('hidden');
                } else {
                    msgBox.innerHTML = `Kaydınız alındı. Sertifika için 3 oturum gerekiyor.<br><span class="text-cyan-400">Mevcut: ${sessionCount}</span>`;
                }
            } catch (err) {
                console.error(err);
                alert("Bağlantı Hatası: Lütfen RLS izinlerini ve SQL fonksiyonunu kontrol edin.");
                btn.disabled = false; btn.innerText = "Tekrar Dene";
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            doc.setFillColor(15, 23, 42); doc.rect(0, 0, 297, 210, 'F');
            doc.setTextColor(34, 211, 238); doc.setFontSize(40);
            doc.text("KATILIM SERTİFİKASI", 148, 70, { align: "center" });
            doc.setTextColor(255, 255, 255); doc.setFontSize(30);
            doc.text(userData.ad_soyad.toUpperCase(), 148, 110, { align: "center" });
            doc.setFontSize(16);
            doc.text("Dijital Güvenlik ve Girişimcilik Zirvesi", 148, 140, { align: "center" });
            doc.save(`Sertifika_${userData.ad_soyad}.pdf`);
        }
    </script>
</body>
</html>
