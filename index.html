<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İSTE Siber Güvenlik Zirvesi - Katılım</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700 p-8">
        <div class="text-center mb-8">
            <div class="inline-block p-3 bg-cyan-500/10 rounded-full mb-4">
                <svg class="w-8 h-8 text-cyan-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04m17.236 0a11.955 11.955 0 01-1.767 6.894c-1.135 1.875-2.73 3.513-4.665 4.82a11.955 11.955 0 01-3.14 1.533 11.955 11.955 0 01-3.14-1.533 11.955 11.955 0 01-4.665-4.821 11.955 11.955 0 01-1.767-6.894m17.236 0A11.955 11.955 0 0112 2.944"></path></svg>
            </div>
            <h1 class="text-2xl font-bold text-white">Zirve Katılım Kaydı</h1>
            <p class="text-slate-400 mt-2 text-sm">Lütfen bilgilerini eksiksiz gir.</p>
        </div>

        <div id="form-section" class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">Ad Soyad</label>
                <input type="text" id="fullname" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none transition" placeholder="Örn: Ahmet Yılmaz">
            </div>
            <div>
                <label class="block text-sm font-medium mb-1">E-posta</label>
                <input type="email" id="email" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-4 py-3 focus:ring-2 focus:ring-cyan-500 outline-none transition" placeholder="orn@mail.com">
            </div>
            <button onclick="checkIn()" id="submit-btn" class="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-lg transition transform active:scale-95 shadow-lg shadow-cyan-900/20">
                Oturuma Katıl
            </button>
        </div>

        <div id="result-section" class="hidden text-center space-y-6 py-4">
            <div id="status-icon" class="mx-auto w-16 h-16 rounded-full flex items-center justify-center"></div>
            <h2 id="result-title" class="text-xl font-bold"></h2>
            <p id="result-desc" class="text-slate-400"></p>
            <button id="pdf-btn" onclick="downloadPDF()" class="hidden w-full bg-green-600 hover:bg-green-500 text-white font-bold py-3 rounded-lg transition shadow-lg shadow-green-900/20">
                Sertifikayı İndir (.PDF)
            </button>
        </div>
    </div>

    <script>
        // SUPABASE BAĞLANTISI (Resimdeki bilgiler eklendi)
        const URL = "https://zii67fvxqitnzmpxxszw.supabase.co";
        const KEY = "sb_publishable_Zii67fvxqitnzmpxxszw"; // Buraya resimdeki Publishable Key'in tamamını yapıştır
        const supabase = supabase.createClient(URL, KEY);

        let userData = null;

        async function checkIn() {
            const name = document.getElementById('fullname').value;
            const email = document.getElementById('email').value;
            const btn = document.getElementById('submit-btn');

            if(!name || !email) return alert("Lütfen tüm alanları doldurun.");
            
            btn.disabled = true;
            btn.innerText = "İşleniyor...";

            try {
                // 1. Aktif oturumu çek
                const { data: config } = await supabase.from('ayarlar').select('aktif_oturum_id').single();
                
                // 2. RPC Fonksiyonunu çalıştır (SQL'de oluşturduğumuz)
                await supabase.rpc('upsert_attendance', { 
                    p_email: email, 
                    p_name: name, 
                    p_session: config.aktif_oturum_id 
                });

                // 3. Kullanıcı verisini tekrar çek
                const { data: user } = await supabase.from('katilimcilar').select('*').eq('email', email).single();
                userData = user;

                showResult(user);
            } catch (err) {
                alert("Bir hata oluştu. Bağlantınızı kontrol edin.");
                btn.disabled = false;
                btn.innerText = "Oturuma Katıl";
            }
        }

        function showResult(user) {
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('result-section').classList.remove('hidden');

            const sessionCount = user.oturumlar.filter(x => x !== null).length;
            const title = document.getElementById('result-title');
            const desc = document.getElementById('result-desc');
            const icon = document.getElementById('status-icon');

            if(sessionCount >= 3) {
                icon.innerHTML = '<svg class="w-10 h-10 text-green-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path></svg>';
                icon.className += " bg-green-500/10";
                title.innerText = "Tebrikler!";
                desc.innerText = `${sessionCount} oturuma katıldınız. Sertifikanız hazır!`;
                document.getElementById('pdf-btn').classList.remove('hidden');
            } else {
                icon.innerHTML = '<svg class="w-10 h-10 text-cyan-500" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path></svg>';
                icon.className += " bg-cyan-500/10";
                title.innerText = "Kaydınız Alındı";
                desc.innerText = `Sertifika için 3 oturum gerekiyor. Şu anki katılımınız: ${sessionCount}`;
            }
        }

        function downloadPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF('l', 'mm', 'a4');
            
            // Sertifika Tasarımı
            doc.setFillColor(15, 23, 42); 
            doc.rect(0, 0, 297, 210, 'F');
            doc.setTextColor(34, 211, 238);
            doc.setFontSize(40);
            doc.text("KATILIM SERTİFİKASI", 148, 70, { align: "center" });
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(20);
            doc.text("Sayın", 148, 100, { align: "center" });
            doc.setFontSize(35);
            doc.text(userData.ad_soyad.toUpperCase(), 148, 120, { align: "center" });
            doc.setFontSize(14);
            doc.text("Dijital Güvenlik ve Girişimcilik Zirvesi Katılımcısı", 148, 150, { align: "center" });
            
            doc.save(`Sertifika_${userData.ad_soyad}.pdf`);
        }
    </script>
</body>
</html>
